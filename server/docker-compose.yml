name: anime-ongaku-server

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: animeongaku-server:latest
    ports: ["${ONGAKU_SERVER_HOST_PORT:-48668}:8080"]
    environment:
      DATABASE_URL: postgres://ongaku:${DB_PASSWORD:-ongaku-dev}@db:5432/ongaku
      NODE_ENV: ${NODE_ENV:-production}
      MEDIA_ROOT: /data/media
      WEB_DIST_PATH: /app/web
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?Set WEB_PUBLIC_ORIGIN to the public HTTPS site origin}
      SONOS_SMAPI_ENABLED: ${SONOS_SMAPI_ENABLED:-true}
      SONOS_PUBLIC_ORIGIN: ${SONOS_PUBLIC_ORIGIN:-}
      AMF_LIBRARY_ROOT: /mnt/amf-library
      KITSU_CLIENT_ID: ${KITSU_CLIENT_ID:-}
      KITSU_CLIENT_SECRET: ${KITSU_CLIENT_SECRET:-}
      KITSU_AUTH_MODE: ${KITSU_AUTH_MODE:-stub}
      MUSIC_CATALOG_ENABLED: ${MUSIC_CATALOG_ENABLED:-true}
      MUSIC_DISCOVERY_ENABLED: ${MUSIC_DISCOVERY_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a non-default value}
      SYNC_INTERVAL_MINUTES: "10080"
      AUDIO_BACKFILL_DELAY_SECONDS: "8"
    volumes:
      - ${AMF_LIBRARY_HOST_PATH:-./.amf-library}:/mnt/amf-library:ro
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ongaku
      POSTGRES_USER: ongaku
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ongaku-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "DB_HOST=$$(hostname -i | awk '{print $$1}'); PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h \"$$DB_HOST\" -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  media:    # audio + images survive container rebuilds
  pgdata:   # database survives container rebuilds
