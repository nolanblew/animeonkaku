name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1) (Leave empty to auto-bump patch version; optional)'
        required: false
        type: string
      version_code:
        description: 'Version Code (e.g. 2) (Leave empty to auto-bump code; optional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: anime-ongaku-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Need full history for tags/commits
        
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./src

    - name: Update release version
      working-directory: ./src
      env:
        REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}
        REQUESTED_VERSION_CODE: ${{ github.event.inputs.version_code }}
      run: |
        python3 << 'PYEOF'
        import re
        import os

        with open('app/build.gradle.kts', 'r') as f:
            content = f.read()

        current_code_match = re.search(r'versionCode = (\d+)', content)
        current_name_match = re.search(r'versionName = "(\d+\.\d+(?:\.\d+)?)"', content)
        if not current_code_match or not current_name_match:
            raise SystemExit('Could not read the current Android version')

        requested_code = os.environ.get('REQUESTED_VERSION_CODE', '').strip()
        requested_name = os.environ.get('REQUESTED_VERSION_NAME', '').strip()

        current_code = int(current_code_match.group(1))
        current_name = current_name_match.group(1)
        if requested_name:
            if not re.fullmatch(r'\d+\.\d+(?:\.\d+)?', requested_name):
                raise SystemExit('version_name must be numeric, for example 1.3.0')
            new_name = requested_name
        else:
            parts = current_name.split('.')
            while len(parts) < 3:
                parts.append('0')
            parts[-1] = str(int(parts[-1]) + 1)
            new_name = '.'.join(parts)

        if requested_code:
            if not requested_code.isdigit() or int(requested_code) <= current_code:
                raise SystemExit('version_code must be an integer greater than the current versionCode')
            new_code = int(requested_code)
        else:
            new_code = current_code + 1

        content = re.sub(r'versionCode = \d+', f'versionCode = {new_code}', content, count=1)
        content = re.sub(r'versionName = "[^"]+"', f'versionName = "{new_name}"', content, count=1)
        content = re.sub(
            r'buildConfigField\("String", "DISPLAY_VERSION", "\\"[^"\\]+\\""\)',
            f'buildConfigField("String", "DISPLAY_VERSION", "\\"{new_name}\\"")',
            content,
            count=1
        )

        with open('app/build.gradle.kts', 'w') as f:
            f.write(content)
        print(f'Prepared versionName={new_name}, versionCode={new_code}')
        PYEOF

    - name: Get Final Version
      id: get_version
      working-directory: ./src
      run: |
        VERSION_NAME=$(grep -oP 'versionName = "\K[^"]*' app/build.gradle.kts)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "Extracted version: $VERSION_NAME"

    - name: Commit Version Bump
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add src/app/build.gradle.kts
        git commit -m "chore: bump version to ${{ env.VERSION_NAME }}" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref_name }}

    - name: Decode Keystore
      working-directory: ./src
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > release.keystore

    - name: Decode google-services.json
      working-directory: ./src/app
      env:
        GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
      run: |
        echo $GOOGLE_SERVICES_BASE64 | base64 --decode > google-services.json

    - name: Build Release APK and AAB
      working-directory: ./src
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/src/release.keystore
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease bundleRelease

    - name: Prepare update artifacts
      working-directory: ./src
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/app-release.apk "release-artifacts/anime-ongaku-v${VERSION_NAME}.apk"
        cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/anime-ongaku-v${VERSION_NAME}.aab"
        cd release-artifacts
        sha256sum "anime-ongaku-v${VERSION_NAME}.apk" > "anime-ongaku-v${VERSION_NAME}.apk.sha256"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION_NAME }}
        name: Release v${{ env.VERSION_NAME }}
        target_commitish: ${{ github.ref_name }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          src/release-artifacts/anime-ongaku-v${{ env.VERSION_NAME }}.apk
          src/release-artifacts/anime-ongaku-v${{ env.VERSION_NAME }}.apk.sha256
          src/release-artifacts/anime-ongaku-v${{ env.VERSION_NAME }}.aab
